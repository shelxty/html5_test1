<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Drawing App // Shelley Ma</title>
        <link rel="stylesheet" href="styles.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
        <script defer src = "script.js"></script>
    </head>
    <body>
        <div class = "container">
            <section class = "tools">
                <div class = "row">
                    <label class="title"><strong>Tools</strong></label>
                    <ul class = "options">
                        <!-- adding the pencil brush and eraser within the UL tag -->
                        <li class = "option">
                            <input type="range" id = "sizeSlider" min = "1" max = "30" value = "5"/> <!-- helps add size of pencil slider/eraser. min 1, max 30, default value of 5-->
                        </li>
                        <li class = "option active tool" id="pencil">
                            <i class = "fas fa-pencil-alt" id="icon"></i>
                            <span>Pencil</span> <!-- helps get font icon to display in tag-->
                            <!-- also the pencil icon is called fas fa-pencil-alt, not fa-pencil -->
                        </li>
                        <li class = "option tool" id="brush">
                            <i class = "fa fa-paint-brush" id="icon"></i>
                            <span>Brush</span> <!-- helps get font icon to display in tag-->
                        </li>
                        <li class = "option tool" id="eraser">
                            <i class = "fa fa-eraser" id="icon"></i> <!-- helps get font icon to display in tag-->
                            <span>Eraser</span>
                        </li>
                        <li class = "option tool" id="undo">
                            <i class = "fa fa-undo" id="icon"></i> <!-- helps get font icon to display in tag-->
                            <span>Undo</span>
                        </li>
                        <li class = "option tool" id="redo">
                            <i class = "fa fa-redo" id="icon"></i> <!-- helps get font icon to display in tag-->
                            <span>Redo</span>
                        </li>
                    </ul>
                </div>
                <div class = "row shapes">
                    <label class="title"><strong>Shapes</strong><input type="checkbox" id = "fillColor"><label for="fillColor">Fill Color</label></label>
                    <ul class = "options">
                        <li class = "option tool" id="rectangle">
                            <i class = "fa fa-square" id="icon"></i> 
                            <!-- this basically creates a menu of all the shapes like how it looked like before -->
                             <span>Rectangle</span>
                        </li>
                        <li class = "option tool" id="circle">
                            <i class = "fa fa-circle" id="icon"></i>
                            <span>Circle</span> 
                        </li>
                        <li class = "option tool" id="triangle">
                            <i class = "fa fa-mountain" id="icon"></i> <!-- it's mountain because that's the icon that looks most like triangles -->
                            <span>Triangle</span>
                        </li>
                        <li class = "option tool" id="square">
                            <i class = "fa fa-square" id="icon"></i> <span>Square</span>
                        </li>
                        <li class = "option tool" id = "hexagon">
                            <i class = "fa-solid fa-cube"></i>
                            <span>Hexagon</span>
                        </li>
                        <li class = "option tool" id = "pentagon">
                            <i class = "fa-solid fa-dice-d6"></i>
                            <span>Pentagon</span>
                        </li>
                        <li class = "option tool" id = "line">
                            <i class = "fa-solid fa-grip-lines"></i>
                            <span>Line</span>
                        </li>
                        <li class = "option tool" id = "arrow">
                            <i class = "fa-solid fa-arrow-up"></i>
                            <span>Arrow</span>
                        </li>
                    </ul>
                </div>
                <div class = "row colors">
                    <label class="title"><strong>Colors</strong></label>
                    <ul class = "options">
                        <li class="option"></li>
                        <li class="option selected"></li>
                        <li class="option"></li>
                        <li class="option"></li>
                        <li class="option"></li>
                        <li class="option">
                            <input type="color" value = "#00ff00" id="colorPicker"/>
                        </li>
                    </ul>
                </div>
            </section>
            <section class = "drawingArea">
                <canvas></canvas>
            </section>
            <div class = "buttons">
                <button class = "clearCanvas"><i class = "fa fa-times"></i> Clear Canvas</button>
                <button class = "saveImg"><i class = "fa-solid fa-floppy-disk"></i> Save As Image</button>
            </div>
        </div>
    </body>
</html>
